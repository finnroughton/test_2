[project]
name = "agent-polly"
version = "0.1.0"
description = "Agent Polly - AI-assisted drone: natural-language commands to safe, obstacle-aware flight"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pybullet",
    "gym-pybullet-drones",
]
[tool.uv.sources]
pybullet = { path = "./bullet3", editable = true }
gym-pybullet-drones = { workspace = true }

[tool.uv.workspace]
members = [
    "gym-pybullet-drones",
]
