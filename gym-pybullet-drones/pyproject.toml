[project]
name = "gym-pybullet-drones"
version = "2.1.0"
description = "PyBullet Gym environments for single and multi-agent reinforcement learning of quadcopter control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jacopo Panerati", email = "jacopo.panerati@utoronto.ca" },
]
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "transforms3d>=0.4",
    "matplotlib>=3.10",
    "pybullet>=3.2.7",
    "gymnasium>=1.2",
    "stable-baselines3>=2.8",
    "control>=0.10.2",
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gym_pybullet_drones"]

[tool.hatch.build.targets.wheel.force-include]
"gym_pybullet_drones/assets" = "gym_pybullet_drones/assets"
